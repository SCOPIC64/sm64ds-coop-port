<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM64DS Coop | Official Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Super+Mario+256&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117; --panel-bg: #161b22; --border-color: #30363d;
            --text-main: #c9d1d9; --text-muted: #8b949e; --accent-green: #238636;
            --mario-font: 'Super Mario 256', sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, sans-serif; font-size: 13px; line-height: 1.5; }
        .container { max-width: 1000px; margin: 20px auto; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; }
        .header { padding: 15px 20px; background: #21262d; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .header-logo-img { max-height: 45px; }
        .nav-bar { background: #161b22; border-bottom: 1px solid var(--border-color); }
        .nav-bar ul { margin: 0; padding: 0; display: flex; list-style: none; }
        .nav-bar a { display: block; padding: 12px 20px; color: var(--text-main); font-weight: bold; font-family: var(--mario-font); font-size: 10px; letter-spacing: 1px; }
        .nav-bar a:hover, .nav-bar a.active { background: #21262d; color: #fff; text-decoration: none; }
        .hero { background: #21262d; border-bottom: 1px solid var(--border-color); padding: 40px 20px; text-align: center; }
        .hero-title { font-family: var(--mario-font); font-size: 22px; color: #fff; margin: 15px 0; }
        .btn { background: #21262d; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 24px; border-radius: 6px; font-family: var(--mario-font); font-size: 9px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: var(--accent-green); color: white; border: none; }
        .content { padding: 20px; }
        .block { background: #21262d; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 20px; overflow: hidden; }
        .block-header { background: #161b22; padding: 12px 15px; font-family: var(--mario-font); font-size: 11px; border-bottom: 1px solid var(--border-color); }
        .block-body { padding: 15px; }
        .footer { text-align: center; padding: 20px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 11px; }
        .avatar-sm { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; margin-right: 8px; border: 1px solid var(--border-color); vertical-align: middle; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="logo.png" alt="Logo" class="header-logo-img">
        <div style="display:flex; align-items:center;">
            <img id="header-avatar" src="" class="avatar-sm" style="display:none;">
            <strong id="user-name" style="font-family: var(--mario-font); font-size: 10px;">Guest</strong>
        </div>
    </div>
    <nav class="nav-bar">
        <ul>
            <li><a href="index.html" class="active">Main Site</a></li>
            <li><a href="mods.html">Mods Repository</a></li>
            <li><a href="forum.html">Forums</a></li>
        </ul>
    </nav>
    <section class="hero">
        <img src="logo.png" alt="Logo" style="max-width: 300px;">
        <div class="hero-title">SM64DS Co-op Port</div>
        <p style="color: var(--text-muted);">The ultimate engine port for Super Mario 64 DS multiplayer.</p>
        <div style="margin-top: 20px;">
            <a href="mods.html" class="btn btn-primary">Browse Mods</a>
            <a href="forum.html" class="btn" style="margin-left: 10px;">Forums</a>
        </div>
    </section>
    <div class="content">
        <div class="block">
            <div class="block-header">Project Overview</div>
            <div class="block-body">Welcome to the hub. Use the navigation to find mods or join the community discussion.</div>
        </div>
    </div>
    <footer class="footer">SM64DS Coop Port Project by SCOPIC64</footer>
</div>
<script>
    let currentUser = JSON.parse(localStorage.getItem("sm64_user"));
    if (currentUser) {
        document.getElementById("user-name").innerText = currentUser.username;
        if (currentUser.avatar) {
            const av = document.getElementById("header-avatar");
            av.src = `https://scopic64.pythonanywhere.com/api/download/${currentUser.avatar}`;
            av.style.display = "inline-block";
        }
    }
</script>
</body>
</html>
