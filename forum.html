<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM64DS Coop | Forums</title>
    <link href="https://fonts.googleapis.com/css2?family=Super+Mario+256&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #0d1117; --panel-bg: #161b22; --border-color: #30363d; 
            --text-main: #c9d1d9; --text-muted: #8b949e; --accent-green: #238636; --danger-red: #da3633; 
            --mario-font: 'Super Mario 256', sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, sans-serif; font-size: 13px; }
        a { color: #58a6ff; text-decoration: none; }
        .container { max-width: 1000px; margin: 20px auto; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; }
        .header { padding: 15px 20px; background: #21262d; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .header-logo-img { max-height: 45px; }
        .nav-bar { background: #161b22; border-bottom: 1px solid var(--border-color); }
        .nav-bar ul { margin: 0; padding: 0; display: flex; list-style: none; }
        .nav-bar a { display: block; padding: 12px 20px; color: var(--text-main); font-weight: bold; font-family: var(--mario-font); font-size: 10px; letter-spacing: 1px; }
        .nav-bar a:hover, .nav-bar a.active { background: #21262d; color: #fff; }
        .content { padding: 20px; }
        .btn { background: var(--accent-green); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-family: var(--mario-font); font-size: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        .btn-secondary { background: #21262d; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-danger { background: var(--danger-red); font-size: 7px; padding: 5px 10px; }
        .forum-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .forum-table th { background: #21262d; text-align: left; padding: 10px; border-bottom: 1px solid var(--border-color); font-family: var(--mario-font); font-size: 8px; }
        .forum-table td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); }
        .forum-table tr:hover td { background: #21262d; cursor: pointer; }
        .post-card { background: #21262d; border: 1px solid var(--border-color); padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .form-input, .form-textarea, .form-select { width: 100%; background: #0d1117; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 4px; margin-bottom: 10px; font-family: inherit; }
        .avatar-sm { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); vertical-align: middle; margin-right: 10px; }
        .custom-emoji { height: 22px; vertical-align: middle; image-rendering: pixelated; }
        .forum-img { max-width: 100%; max-height: 400px; border-radius: 4px; margin-top: 10px; display: block; border: 1px solid var(--border-color); }
        .toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; background: #0d1117; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="logo.png" alt="Logo" class="header-logo-img">
        <div style="display:flex; align-items:center;">
            <strong id="user-name" style="font-family: var(--mario-font); font-size: 10px;">Guest</strong>
        </div>
    </div>
    <nav class="nav-bar">
        <ul>
            <li><a href="index.html">Main Site</a></li>
            <li><a href="mods.html">Mods Repository</a></li>
            <li><a href="forum.html" class="active">Forums</a></li>
        </ul>
    </nav>
    <div class="content">
        <div id="threads-view">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 style="font-family:var(--mario-font); font-size:16px;">Community Board</h2>
                <button class="btn" onclick="toggleNewThread()">+ New Thread</button>
            </div>
            <div id="new-thread-box" style="display:none; margin-top:15px;">
                <input type="text" id="thread-title" class="form-input" placeholder="Enter Your Thread Title...">
                <div class="toolbar">
                    <button class="btn btn-secondary" onclick="insertEmoji(':egg:')">Sob Yoshi</button>
                    <button class="btn btn-secondary" onclick="insertEmoji(':mario:')">Sob Mario</button>
                    <button class="btn btn-secondary" onclick="insertEmoji(':luigi:')">Sob Luigi</button>
                </div>
                <textarea id="thread-content" class="form-textarea" style="height:120px;" placeholder="Enter Your Content... (Paste images with Ctrl+V)" onpaste="handlePaste(event, 'thread-content')"></textarea>
                <button class="btn" onclick="createThread()">Post Thread</button>
            </div>
            <table class="forum-table">
                <thead><tr><th>Discussion</th><th>Author</th><th>Replies</th><th>Date</th></tr></thead>
                <tbody id="threads-body"></tbody>
            </table>
        </div>
        <div id="thread-detail-view" style="display:none;">
            <button class="btn btn-secondary" style="margin-bottom:15px;" onclick="backToThreads()">Back</button>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 id="view-title" style="font-family:var(--mario-font); font-size:14px;"></h2>
                <div id="thread-actions"></div>
            </div>
            <div id="posts-list"></div>
            <div style="margin-top:20px;">
                <div class="toolbar">
                    <button class="btn btn-secondary" onclick="insertEmoji(':sob:')">Insert Sob</button>
                </div>
                <textarea id="reply-content" class="form-textarea" placeholder="Enter Your Reply... (Paste images with Ctrl+V)" onpaste="handlePaste(event, 'reply-content')"></textarea>
                <button class="btn" onclick="sendReply()">Submit Reply</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://scopic64.pythonanywhere.com/api";
    let currentUser = JSON.parse(localStorage.getItem("sm64_user"));
    let currentThreadId = null;

    const SOB_EMOTES = {
        yoshi: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAYklEQVQ4T2NkIAYwEnLBAmR5RhS+O5B9GIlXjG4Aujp8BtCcBvInmIF4XQByIbwBjDsh8mD2Y8mD+R+mAF0SpgBdBqYAXQLUv7A+LIDqB8YFmAA2L8DqYfWCBfAZQC6A9T9yAcwLAKN4C8v6p4aNAAAAAElFTkSuQmCC',
        mario: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAY0lEQVQ4T2NkIAYwEnLBAmR5RhS+O5B9GIlXjG4Aujp8BtCcBvInmIF4XQByIbwBjDsh8mD2Y8mD+R+mAF0SpgBdBqYAXQLUv7A+LIDqB8YFmAA2L8DqYfWCBfAZQC6A9T9yAcwLAKRQC8szG8vWAAAAAElFTkSuQmCC',
        luigi: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAYklEQVQ4T2NkIAYwEnLBAmR5RhS+O5B9GIlXjG4Aujp8BtCcBvInmIF4XQByIbwBjDsh8mD2Y8mD+R+mAF0SpgBdBqYAXQLUv7A+LIDqB8YFmAA2L8DqYfWCBfAZQC6A9T9yAcwLAKWcC8vT6YvGAAAAAElFTkSuQmCC'
    };

    document.addEventListener("DOMContentLoaded", () => {
        if (currentUser) document.getElementById("user-name").innerText = currentUser.username;
        loadThreads();
    });

    async function handlePaste(e, id) {
        const item = Array.from(e.clipboardData.items).find(x => x.type.startsWith('image'));
        if (item) {
            e.preventDefault();
            const f = new FormData(); f.append("image", item.getAsFile());
            const res = await fetch(`${API_URL}/upload-image`, { method: "POST", body: f });
            const data = await res.json();
            const ta = document.getElementById(id);
            ta.value += `\n[img]https://scopic64.pythonanywhere.com${data.url}[/img]\n`;
        }
    }

    function insertEmoji(tag) {
        const active = document.activeElement;
        if (active.tagName === 'TEXTAREA') {
            active.value = active.value.substring(0, active.selectionStart) + " " + tag + " " + active.value.substring(active.selectionEnd);
        }
    }

    async function loadThreads() {
        const res = await fetch(`${API_URL}/forum/threads`);
        const threads = await res.json();
        const tbody = document.getElementById("threads-body");
        tbody.innerHTML = threads.map(t => {
            let avatar = t.avatar ? `<img src="${API_URL}/download/${t.avatar}" class="avatar-sm">` : '';
            return `<tr onclick="openThread(${t.id})">
                <td><strong>${format(t.title)}</strong></td>
                <td><div style="display:flex;align-items:center;">${avatar}${t.author}</div></td>
                <td>${t.reply_count - 1}</td>
                <td>${t.created_at}</td>
            </tr>`;
        }).join('');
    }

    async function openThread(id) {
        currentThreadId = id;
        document.getElementById("threads-view").style.display = "none";
        document.getElementById("thread-detail-view").style.display = "block";
        const res = await fetch(`${API_URL}/forum/threads/${id}`);
        const data = await res.json();
        document.getElementById("view-title").innerText = data.thread.title;
        if (currentUser && (currentUser.role === 'Owner' || currentUser.username === data.thread.author)) {
            document.getElementById("thread-actions").innerHTML = `<button class="btn btn-danger" onclick="deleteThread(${id})">Delete</button>`;
        }
        document.getElementById("posts-list").innerHTML = data.posts.map(p => {
            let av = p.avatar ? `<img src="${API_URL}/download/${p.avatar}" class="avatar-sm">` : '';
            return `<div class="post-card"><div style="margin-bottom:10px; display:flex; align-items:center;">${av} <strong>${p.author}</strong> (${p.pronouns || ''})</div><div>${format(p.content, p.favorite_char)}</div></div>`;
        }).join('');
    }

    function format(text, char = 'mario') {
        let s = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        s = s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
        s = s.replace(/\[img\](.*?)\[\/img\]/g, '<img src="$1" class="forum-img">');
        s = s.replace(/:egg:/g, `<img src="${SOB_EMOTES.yoshi}" class="custom-emoji">`);
        s = s.replace(/:mario:/g, `<img src="${SOB_EMOTES.mario}" class="custom-emoji">`);
        s = s.replace(/:luigi:/g, `<img src="${SOB_EMOTES.luigi}" class="custom-emoji">`);
        s = s.replace(/:sob:/g, `<img src="${SOB_EMOTES[char] || SOB_EMOTES.mario}" class="custom-emoji">`);
        return s;
    }

    async function createThread() {
        const title = document.getElementById("thread-title").value;
        const content = document.getElementById("thread-content").value;
        await fetch(`${API_URL}/forum/threads`, {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ title, content, author: currentUser.username, author_role: currentUser.role })
        });
        location.reload();
    }

    async function sendReply() {
        const content = document.getElementById("reply-content").value;
        await fetch(`${API_URL}/forum/posts`, {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ thread_id: currentThreadId, content, author: currentUser.username, author_role: currentUser.role })
        });
        document.getElementById("reply-content").value = "";
        openThread(currentThreadId);
    }

    function toggleNewThread() { let b = document.getElementById("new-thread-box"); b.style.display = b.style.display === "none" ? "block" : "none"; }
    function backToThreads() { document.getElementById("thread-detail-view").style.display = "none"; document.getElementById("threads-view").style.display = "block"; }
</script>
</body>
</html>
