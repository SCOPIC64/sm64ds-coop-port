name: Native desktop adapters (not game releases)
on:
  push:
    branches: ['codex/native-platforms']
  pull_request:
    paths:
      - 'port/desktop/**'
      - 'port/native/**'
      - 'port/tests/coop_native_desktop*.cpp'
      - '.github/workflows/native-desktop-checks.yml'
permissions:
  contents: read
jobs:
  desktop-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL desktop development headers on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build
      - name: Install desktop build tools on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Compile the real native window, input and audio adapter
        run: cmake -S port/desktop -B build/native-desktop -G Ninja -DCMAKE_BUILD_TYPE=Debug -DDESKTOP_HOST_SANITIZERS=ON && cmake --build build/native-desktop --parallel 2
      - name: Exercise SDL pixels, resize/focus/input/controller and audio lifecycle
        run: ctest --test-dir build/native-desktop --output-on-failure
  linux32-desktop-runtime:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install actual 32-bit SDL and compiler runtime
        run: sudo dpkg --add-architecture i386 && sudo apt-get update && sudo apt-get install -y clang g++-multilib libsdl2-dev:i386 ninja-build
      - name: Build the desktop adapter with the actual DS core
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: cmake -S port/native -B build/native-desktop32 -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_C_FLAGS=-m32 -DNATIVE_DESKTOP_HOST_CHECKS=ON -DCMAKE_BUILD_TYPE=Debug && cmake --build build/native-desktop32 --parallel 2
      - name: Run native DS, allocator, seven-endpoint UDP and SDL output checks
        run: ctest --test-dir build/native-desktop32 --output-on-failure
